<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Seller dashboard · SwiftCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
          <h1 class="h3 m-0">Seller dashboard</h1>
          <small class="text-secondary" id="who"></small>
        </div>
        <button class="btn btn-primary" onclick="openM()"><i class="bi bi-plus-lg"></i> Add product</button>
      </div>
      <div class="row g-3 mb-4" id="stats"></div>
      <ul class="nav nav-pills mb-3">
        <li class="nav-item">
          <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tp">Products</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-bs-toggle="pill" data-bs-target="#to">Orders</button>
        </li>
      </ul>
      <div class="tab-content">
        <div class="tab-pane show active" id="tp">
          <div class="card-s table-responsive">
            <table class="table align-middle m-0">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="pt"></tbody>
            </table>
          </div>
        </div>
        <div class="tab-pane" id="to">
          <div class="card-s table-responsive">
            <table class="table align-middle m-0">
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="ot"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
    <div class="modal fade" id="m">
      <div class="modal-dialog">
        <form class="modal-content" id="f" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="mt">Add product</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body row g-3">
            <div class="col-12">
              <label class="form-label">Product name</label>
              <input id="n" class="form-control" required minlength="3" maxlength="60">
              <div class="invalid-feedback">Name must be 3–60 characters.</div>
            </div>
            <div class="col-6">
              <label class="form-label">Price (Rs.)</label>
              <input id="p" type="number" class="form-control" required min="1" max="1000000">
              <div class="invalid-feedback">Enter a price from 1 to 1,000,000.</div>
            </div>
            <div class="col-6">
              <label class="form-label">Stock quantity</label>
              <input id="s" type="number" class="form-control" required min="0" max="9999" step="1">
              <div class="invalid-feedback">Enter a whole number from 0 to 9,999.</div>
            </div>
            <div class="col-12">
              <label class="form-label">Category</label>
              <select id="c" class="form-select" required>
                <option value="">Choose</option>
                <option>Electronics</option>
                <option>Clothes</option>
                <option>Home</option>
                <option>Beauty</option>
              </select>
              <div class="invalid-feedback">Choose a category.</div>
            </div>
            <div class="col-12">
              <label class="form-label">
                Product image
                <span class="text-secondary">(optional, JPG or PNG)</span>
              </label>
              <input type="file" accept=".jpg,.jpeg,.png" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Description <span class="text-secondary">(optional)</span></label>
              <textarea id="d" class="form-control" rows="2" maxlength="200"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary">Save product</button>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
      const s = get('sc_seller', null);
      if (!s)
        location = 'signin.html';
      $('#who').textContent = s ? s.store + ' · ' + s.email : '';
      let items = PRODUCTS.map(p => ({ ...p })), edit = null;
      const modal = new bootstrap.Modal('#m');
      let orders = [['SC-48213', 'Ayesha Khan', 17998, 'Pending'], ['SC-48190', 'Bilal Ahmed', 5299, 'Shipped'], ['SC-48122', 'Sana Malik', 12499, 'Delivered'], ['SC-48107', 'Usman Raza', 3899, 'Pending']];
      const col = {
        Pending: 'warning', Shipped: 'primary', Delivered: 'success'
      };
      function draw() {
        $('#pt').innerHTML = items.map(p => '<tr><td>' + p.e + ' <b>' + p.n + '</b></td><td>' + p.c + '</td><td>' + fmt(p.p) + '</td><td><span class="badge text-bg-' + (p.s < 1 ? 'danger' : p.s < 5 ? 'warning' : 'success') + '">' + p.s + '</span></td><td class="text-end"><button class="btn btn-sm btn-light" onclick="openM(' + p.id + ')"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-light text-danger" onclick="del(' + p.id + ')"><i class="bi bi-trash"></i></button></td></tr>').join('');
        $('#ot').innerHTML = orders.map((o, i) => '<tr><td><b>' + o[0] + '</b></td><td>' + o[1] + '</td><td>' + fmt(o[2]) + '</td><td><select class="form-select form-select-sm w-auto border-' + col[o[3]] + '" onchange="st(' + i + ',this.value)">' + Object.keys(col).map(x => '<option' + (x == o[3] ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></td></tr>').join('');
        const rev = orders.reduce((a, o) => a + o[2], 0);
        $('#stats').innerHTML = [['Products', items.length, 'bi-box-seam'], ['Low stock', items.filter(p => p.s < 5).length, 'bi-exclamation-triangle'], ['Orders', orders.length, 'bi-receipt'], ['Revenue', fmt(rev), 'bi-cash-stack']].map(x => '<div class="col-6 col-lg-3">'
          + '<div class="card-s stat p-3"><small class="text-secondary"><i class="bi ' + x[2] + '"></i> ' + x[0] + '</small><div class="price fs-4">' + x[1] + '</div></div></div>').join('');
      }
      function st(i, v) {
        orders[i][3] = v;
        draw();
        toast(orders[i][0] + ' marked ' + v);
      }
      function del(id) {
        if (confirm('Delete this product?')) {
          items = items.filter(p => p.id != id);
          draw();
          toast('Product deleted', 'danger');
        }
      }
      function openM(id) {
        edit = id || null;
        const p = items.find(x => x.id == id) || {
          n: '', p: '', s: '', c: '', d: ''
        };
        $('#mt').textContent = id ? 'Edit product' : 'Add product';
        $('#n').value = p.n;
        $('#p').value = p.p;
        $('#s').value = p.s;
        $('#c').value = p.c;
        $('#d').value = p.d;
        $('#f').classList.remove('was-validated');
        modal.show();
      }
      check($('#f'));
      $('#f').addEventListener('valid', () => {
        const v = {
          n: $('#n').value, p: +$('#p').value, s: +$('#s').value, c: $('#c').value, d: $('#d').value
        };
        if (edit)
          Object.assign(items.find(x => x.id == edit), v);
        else
          items.unshift({
            id: Date.now(), e: '📦', bg: '#eef1f7', ...v
          });
        modal.hide();
        draw();
        toast('Product saved');
      });
      draw();
    </script>
  </body>
</html>
