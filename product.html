<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product · SwiftCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <nav class="small mb-3"><a href="index.html">Shop</a> / <span id="bc"></span></nav>
      <div id="box"></div>
      <h2 class="h4 mt-5 mb-3">More to explore</h2>
      <div class="row g-3" id="rel"></div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
      const p = byId(new URLSearchParams(location.search).get('id')) || PRODUCTS[0];
      $('#bc').textContent = p.n;
      document.title = p.n + ' · SwiftCart';
      const out = p.s < 1;
      $('#box').innerHTML = `<div class="row g-4">
       <div class="col-md-6">
       <div class="pimg rounded-4" style="background:${p.bg};font-size:9rem;aspect-ratio:1/.85">${p.e}</div>
       </div>
      <div class="col-md-6"><small class="text-secondary">${p.c}</small><h1 class="h2">${p.n}</h1><div class="price fs-3 my-2">${fmt(p.p)}</div><p class="text-secondary">${p.d}</p>
      <p class="fw-semibold ${out ? 'text-danger' : p.s < 5 ? 'text-warning' : 'text-success'}"><i class="bi bi-box-seam"></i> ${out ? 'Out of stock' : p.s < 5 ? 'Only ' + p.s + ' left' : p.s + ' in stock'}</p>
      <div class="d-flex gap-2 align-items-center">
       <div class="input-group w-auto"><button class="btn btn-outline-dark" id="mn">−</button><input id="qty" class="form-control text-center" style="max-width:70px" value="1" readonly><button class="btn btn-outline-dark" id="pl">+</button>
       </div>
      <button class="btn btn-primary btn-lg" id="add" ${out ? 'disabled' : ''}><i class="bi bi-bag-plus"></i> Add to cart</button>
       </div>
      <ul class="list-unstyled small text-secondary mt-4">
       <li><i class="bi bi-truck"></i> Delivery in 2–4 working days</li>
       <li><i class="bi bi-shield-check"></i> Seller-verified listing</li>
       </ul>
       </div>
       </div>`;
      const qe = $('#qty');
      $('#mn').onclick = () => qe.value = Math.max(1, qe.value - 1);
      $('#pl').onclick = () => {
        if (+qe.value < p.s)
          qe.value++;
        else
          toast('Only ' + p.s + ' available', 'warning');
      };
      $('#add').onclick = () => addCart(p.id, +qe.value);
      $('#rel').innerHTML = PRODUCTS.filter(x => x.c == p.c && x.id != p.id || x.id % 3 == 0 && x.id != p.id).slice(0, 4).map(card).join('');
    </script>
  </body>
</html>
