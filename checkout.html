<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Checkout · SwiftCart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="assets/style.css" rel="stylesheet">
  </head>
  <body>
    <div id="nav"></div>
    <main class="container py-4">
      <h1 class="h3 mb-4">Checkout</h1>
      <div id="done" class="d-none"></div>
      <div class="row g-4" id="main">
        <div class="col-lg-7">
          <form id="f" class="card-s p-4" novalidate>
            <h2 class="h5 mb-3">Shipping details</h2>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Full name</label>
                <input name="name" class="form-control" required minlength="3" maxlength="50" pattern="[A-Za-z ]+" placeholder="Ayesha Khan">
                <div class="invalid-feedback">Enter your name using letters only (3–50 characters).</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input name="phone" class="form-control" required pattern="03[0-9]{2}-?[0-9]{7}" placeholder="0300-1234567">
                <div class="invalid-feedback">Use a Pakistani mobile number, like 0300-1234567.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email <span class="text-secondary">(optional)</span></label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com">
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>
              <div class="col-12">
                <label class="form-label">Street address</label>
                <textarea name="addr" class="form-control" rows="2" required minlength="10" maxlength="150" placeholder="House 12, Street 4, Gulberg"></textarea>
                <div class="invalid-feedback">Address must be 10–150 characters.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">City</label>
                <select class="form-select" required>
                  <option value="">Choose city</option>
                  <option>Lahore</option>
                  <option>Karachi</option>
                  <option>Islamabad</option>
                  <option>Faisalabad</option>
                  <option>Multan</option>
                </select>
                <div class="invalid-feedback">Choose your city.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Postal code</label>
                <input class="form-control" required pattern="[0-9]{5}" inputmode="numeric" placeholder="54000">
                <div class="invalid-feedback">Postal code is exactly 5 digits.</div>
              </div>
              <div class="col-12">
                <label class="form-label d-block">Payment</label>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="pay" id="p1" checked>
                  <label class="form-check-label" for="p1">Cash on delivery</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="pay" id="p2">
                  <label class="form-check-label" for="p2">Card (demo)</label>
                </div>
              </div>
            </div>
            <button class="btn btn-primary btn-lg w-100 mt-4">Place order</button>
          </form>
        </div>
        <div class="col-lg-5">
          <div class="card-s p-4" id="sum"></div>
        </div>
      </div>
    </main>
    <div id="foot"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
    <script>
      const c = cart(), ids = Object.keys(c), t = get('sc_totals', {
        sub: 0, tax: 0, ship: 0, total: 0
      });
      if (!ids.length && !get('sc_last', null)) {
        location = 'cart.html';
      }
      const lines = ids.map(id => {
        const p = byId(id);
        return '<div class="d-flex justify-content-between small mb-2"><span>' + p.e + ' ' + p.n + ' × ' + c[id] + '</span><span>' + fmt(p.p * c[id]) + '</span></div>';
      }).join('');
      $('#sum').innerHTML = '<h2 class="h5 mb-3">Your items</h2>' + lines + '<hr><div class="d-flex justify-content-between small"><span>Subtotal</span><span>' + fmt(t.sub) + '</span></div><div class="d-flex justify-content-between small"><span>Tax</span><span>' + fmt(t.tax) + '</span>'
        + '</div>'
        + '<div class="d-flex justify-content-between small"><span>Shipping</span><span>' + (t.ship ? fmt(t.ship) : 'Free') + '</span>'
        + '</div>'
        + '<div class="d-flex justify-content-between price fs-5 mt-2"><span>Total</span><span>' + fmt(t.total) + '</span></div>';
      const f = $('#f');
      check(f);
      f.addEventListener('valid', () => {
        const no = 'SC-' + Math.floor(10000 + Math.random() * 89999), d = new Date().toLocaleDateString('en-GB');
        $('#main').classList.add('d-none');
        const e = $('#done');
        e.classList.remove('d-none');
        e.innerHTML = '<div class="card-s p-4 p-md-5 mx-auto" style="max-width:640px">'
          + '<div class="text-center"><i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem"></i>'
          + '<h2 class="h3 mt-2">Order placed</h2>'
          + '<p class="text-secondary">Thanks, ' + f.name.value.split(' ')[0] + '. We will call ' + f.phone.value + ' before delivery.</p>'
          + '</div>'
          + '<div class="border rounded-3 p-3 mt-3">'
          + '<div class="d-flex justify-content-between mb-2"><b>Receipt ' + no + '</b><span class="text-secondary">' + d + '</span></div>' + lines + '<hr><div class="d-flex justify-content-between price"><span>Total (' + ($('#p1').checked ? 'Cash on delivery' : 'Card') + ')</span><span>' + fmt(t.total) + '</span></div><div class="small text-secondary mt-2">Ship to: ' + f.addr.value + ', ' + f.querySelector('select').value + '</div>'
          + '</div>'
          + '<div class="d-flex gap-2 mt-4 justify-content-center"><button class="btn btn-outline-dark" onclick="print()"><i class="bi bi-printer"></i> Print receipt</button><a href="index.html" class="btn btn-primary">Continue shopping</a>'
          + '</div>'
          + '</div>';
        ids.forEach(id => byId(id).s -= c[id]);
        set('sc_cart', {});
        badge();
        scrollTo(0, 0);
      });
    </script>
  </body>
</html>
